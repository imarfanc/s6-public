<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color study</title><style>body{margin:0;padding:clamp(24px,6vw,60px);background:#f7eee5;color:#402f35;font:16px/1.6 system-ui}h1{font:clamp(38px,7vw,64px)/1.1 Georgia}.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:35px 0}.swatch{height:190px;border-radius:80px 80px 10px 10px;display:grid;align-items:end;padding:16px;color:#fff}button{border:1px solid #402f35;background:transparent;padding:12px 20px;border-radius:30px;color:inherit;cursor:pointer}#note{min-height:30px}</style><small>AN EXPERIMENT IN EVERYDAY COLOR</small><h1>A softer afternoon.</h1><p>Four colors borrowed from a walk around the block.</p><div class="palette"><div class="swatch" style="background:#a65c48">Terracotta</div><div class="swatch" style="background:#637961">Sage</div><div class="swatch" style="background:#536b83">Blue hour</div><div class="swatch" style="background:#876177">Plum</div></div><button id="inspire">A little inspiration</button><p id="note" aria-live="polite"></p><script type="module">document.querySelector('#inspire').onclick=()=>{document.querySelector('#note').textContent='Start with one color. See where it takes you.';};</script></html>
