<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pages Lite</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="grid.css">
  <script type="module" src="grid.js"></script>
</head>
<body>
  <svg hidden>
    <symbol id="i-app" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>
  <div class="shell">
    <aside class="sidebar" aria-label="Library">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-app"/></svg></span><h1>Pages Lite</h1></div>
      <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" aria-label="Search files" placeholder="Search files"><kbd aria-hidden="true">/</kbd></label>
      <nav id="scopes" aria-label="Filter files"></nav>
      <div class="sidebar-foot">
        <button id="refresh" class="button" type="button"><svg class="icon"><use href="#i-refresh"/></svg><span>Refresh</span></button>
        <a class="button ghost" href="list.html"><svg class="icon"><use href="#i-list"/></svg><span>List view</span></a>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="heading"><p class="crumb"><span id="crumb">Library</span><span id="status" role="status">Loading files…</span></p><h2 id="scope-title">All files</h2></div>
        <div class="options">
          <label>Sort <select id="sort"><option value="name">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="recent">Recently opened</option><option value="type">File type</option><option value="folder">Folder</option></select></label>
          <label>Group <select id="group"><option value="folder">Folder</option><option value="none">None</option><option value="type">File type</option><option value="initial">Name initial</option><option value="recent">Recently opened</option></select></label>
          <fieldset class="segmented"><legend>Open in</legend><span class="track"><label><input type="radio" name="open-mode" value="standalone" checked>New tab</label><label><input type="radio" name="open-mode" value="dialog">Dialog</label></span></fieldset>
        </div>
      </header>
      <div id="empty" class="empty" hidden><p id="empty-message"></p><button id="clear" class="button" type="button">Show all files</button></div>
      <section id="grid" aria-label="File previews"></section>
      <footer>Add <code>.html</code>, <code>.md</code>, <code>.toml</code>, or <code>.json</code> files to <code>apps/pages-lite/data/</code>, then Refresh.</footer>
    </main>
  </div>
  <dialog id="reader" aria-labelledby="reader-title">
    <div class="reader-bar">
      <span id="reader-kind" class="kind"></span>
      <div class="reader-name"><h2 id="reader-title"></h2><p id="reader-path"></p></div>
      <a id="standalone" class="button ghost" target="_blank" rel="noopener"><svg class="icon"><use href="#i-external"/></svg><span>Open in new tab</span></a>
      <button id="close" class="button" type="button" autofocus><svg class="icon"><use href="#i-close"/></svg>Close</button>
    </div>
    <iframe id="full-preview" title="Full document preview"></iframe>
  </dialog>
</body>
</html>
