<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Light mode. Same neon identity, but the glow becomes a soft lift and
           every accent is darkened until it carries text on white. */
        --page: #fdf1fa;
        --panel: #ffffff;
        --field: #fffdff;
        --ink: #1b0a22;
        --muted: #6b3d7b;
        --line: #c9007e33;
        --field-line: #0b7f95;
        --accent: #c9007e;
        --accent-hover: #a30065;
        --accent-text: #ffffff;
        --danger: #bd1743;
        --danger-hover: #94102f;
        --done: #8a6b95;
        --shadow: 0 10px 30px #c9007e1f, 0 2px 10px #0b7f9514;
        --glow: 22%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--page);
        color: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #07040c;
          --panel: #120617;
          --field: #0a0410;
          --ink: #f4ffff;
          --muted: #9d7dff;
          --line: #00f0ff66;
          --field-line: #ff2bd6;
          --accent: #00f0ff;
          --accent-hover: #7ef9ff;
          --accent-text: #07040c;
          --danger: #ff4d8d;
          --danger-hover: #ff8fb8;
          --done: #c9a6ff99;
          --shadow: 0 0 28px #00f0ff55, 0 0 70px #ff2bd640;
          --glow: 70%;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 1.25rem; background: var(--page); }
      main {
        width: min(100%, 38rem);
        margin: 5vh auto;
        padding: clamp(1.25rem, 4vw, 2.25rem);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
      }
      nav a { color: var(--accent); text-decoration: none; }
      h1 {
        margin: 1.25rem 0 .25rem;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -.05em;
        color: var(--accent);
        text-shadow: 0 0 12px color-mix(in srgb, var(--accent) var(--glow), transparent);
      }
      .intro { margin: 0 0 1.5rem; color: var(--muted); }
      .intro code {
        padding: .1rem .35rem;
        border-radius: .35rem;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .85em;
      }
      form { display: flex; gap: .65rem; }
      input[type="text"] {
        min-width: 0;
        flex: 1;
        padding: .8rem 1rem;
        border: 1px solid var(--field-line);
        border-radius: .7rem;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }
      input[type="text"]::placeholder { color: var(--muted); opacity: .8; }
      input[type="text"]:focus-visible, button:focus-visible, a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 2px;
      }
      button[disabled] { cursor: default; opacity: .5; }
      button {
        border: 0;
        border-radius: .7rem;
        padding: .8rem 1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      form button {
        background: var(--accent);
        color: var(--accent-text);
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      form button:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 24px color-mix(in srgb, var(--accent-hover) 75%, transparent);
      }
      #status { min-height: 1.5rem; margin: 1rem 0 .4rem; color: var(--muted); }
      #status.error { color: var(--danger); }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; padding: .85rem 0; border-top: 1px solid var(--line); }
      li.done span { color: var(--done); text-decoration: line-through; }
      li button { padding: .4rem .6rem; background: transparent; color: var(--danger); }
      li button:hover { color: var(--danger-hover); background: color-mix(in srgb, var(--danger) 10%, transparent); }
      input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
      .filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.25rem; }
      .filters button { background: var(--field); color: var(--muted); border: 1px solid var(--line); padding: .5rem .8rem; }
      .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
      #empty { color: var(--muted); padding: 1rem 0; }
      li span { overflow-wrap: anywhere; min-width: 0; }
      .summary { margin: 1.1rem 0 0; color: var(--muted); font-size: .9rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="/">← All apps</a></nav>
      <h1>Todo</h1>
      <p class="intro">
        A small list saved through <code>/api/data/</code>, under the
        <code>todo1</code> namespace, shared by visitors to this instance.
      </p>
      <form id="todo-form">
        <label class="sr-only" for="todo-input">New todo</label>
        <input id="todo-input" type="text" maxlength="500" placeholder="What needs doing?" required autocomplete="off">
        <button type="submit" disabled>Add</button>
      </form>
      <p id="status" role="status"></p>
      <div class="filters" role="group" aria-label="Filter todos">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <ul id="todo-list"></ul>
      <p id="empty" hidden role="status"></p>
      <p id="summary" class="summary" hidden></p>
    </main>
    <script type="module">
      import { autosave, store } from "/shared/store.js";

      /* The key's lack of a meaningful extension makes it JSON, which the
         server parses before storing — a truncated write fails at the call
         rather than turning into an unreadable list later. */
      const KEY = "todos.json";

      const data = store();
      const form = document.querySelector("#todo-form");
      const input = document.querySelector("#todo-input");
      const list = document.querySelector("#todo-list");
      const status = document.querySelector("#status");
      const summary = document.querySelector("#summary");
      let todos = [];
      let loaded = false;
      let filter = "all";

      function setStatus(message = "", error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
      }

      /* Every edit is applied locally and drawn immediately; the write is
         coalesced and reported here, so a burst of checkbox clicks is one
         request and a failure still names itself. */
      const save = autosave((value) => data.put(KEY, value), {
        delay: 400,
        onState: (state) => {
          if (state instanceof Error) return setStatus(state.message || "Could not save.", true);
          if (state === "saving") return setStatus("Saving…");
          setStatus(todos.length === 0 ? "No todos yet." : "Saved");
        },
      });

      function commit(next) {
        if (!loaded) return;
        todos = next;
        render();
        save(todos);
      }

      function render() {
        const visible = todos.filter((todo) => filter === "all" || (filter === "completed" ? todo.done : !todo.done));
        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });
        const empty = document.querySelector("#empty");
        empty.hidden = !loaded || visible.length > 0;
        empty.textContent = todos.length === 0 ? "Add your first todo above." : filter === "active" ? "All caught up. No active todos." : "No completed todos yet.";
        list.replaceChildren(...visible.map((todo) => {
          const item = document.createElement("li");
          item.className = todo.done ? "done" : "";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.done;
          checkbox.setAttribute("aria-label", `Mark ${todo.text} as ${todo.done ? "incomplete" : "complete"}`);
          checkbox.addEventListener("change", () => toggle(todo));
          const text = document.createElement("span");
          text.textContent = todo.text;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", `Delete ${todo.text}`);
          remove.addEventListener("click", () => destroy(todo));
          item.append(checkbox, text, remove);
          return item;
        }));
        const remaining = todos.filter((todo) => !todo.done).length;
        summary.hidden = todos.length === 0;
        summary.textContent = `${remaining} of ${todos.length} remaining`;
        form.querySelector("button").disabled = !loaded;
      }

      function toggle(todo) {
        commit(todos.map((item) => item.id === todo.id ? { ...item, done: !item.done } : item));
      }

      function destroy(todo) {
        commit(todos.filter((item) => item.id !== todo.id));
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        commit([{ id: crypto.randomUUID(), text, done: false }, ...todos]);
      });

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      /* Nothing stored yet is the normal first run, not an error: store.js
         returns null and the list simply starts empty. */
      setStatus("Loading…");
      try {
        const stored = await data.get(KEY);
        if (stored !== null && !Array.isArray(stored)) throw new Error("Saved todos are unreadable.");
        todos = stored ?? [];
        loaded = true;
        render();
        setStatus(todos.length === 0 ? "No todos yet." : "");
      } catch (error) {
        render();
        setStatus(error.message || "Could not load todos.", true);
      }
    </script>
  </body>
</html>
